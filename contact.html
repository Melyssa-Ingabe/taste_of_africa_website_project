<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Contact Tastes of Africa with questions, recipe ideas or feedback.">
  <title>Contact | Tastes of Africa</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="site-header">
    <a href="index.html" class="logo">Tastes of Africa</a>
    <nav aria-label="Main navigation">
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="recipes.html">Recipes</a></li>
        <li><a href="west-africa.html">West Africa</a></li>
        <li><a href="east-africa.html">East Africa</a></li>
        <li><a href="about.html">About Us</a></li>
        <li><a href="contact.html" aria-current="page">Contact</a></li>
      </ul>
    </nav>
    <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode">
      <i class="fa-solid fa-moon" aria-hidden="true"></i>
    </button>
  </header>

  <main class="contact-page">

    <h1 class="page-title">Contact Us</h1>
    <p class="page-intro">Have a question, a recipe idea or some feedback? Send us a message.</p>

    <form id="contact-form" class="contact-form">

      <div class="form-group">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" placeholder="Your name" required>
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required>
      </div>

      <div class="form-group">
        <label for="country">Country</label>
        <select id="country" name="country" required>
          <option value="">Select your country</option>
          <option value="Rwanda">Rwanda</option>
          <option value="Ghana">Ghana</option>
          <option value="Nigeria">Nigeria</option>
          <option value="Ethiopia">Ethiopia</option>
          <option value="Kenya">Kenya</option>
          <option value="Uganda">Uganda</option>
          <option value="Tanzania">Tanzania</option>
          <option value="Senegal">Senegal</option>
          <option value="Other">Other</option>
        </select>
      </div>

      <div class="form-group">
        <label for="dish">Favorite African dish</label>
        <input type="text" id="dish" name="dish" list="dish-suggestions" placeholder="Start typing or pick a suggestion">
        <datalist id="dish-suggestions">
          <option value="Jollof Rice"></option>
          <option value="Injera"></option>
          <option value="Isombe"></option>
          <option value="Banku with okra soup"></option>
          <option value="Akabenzi"></option>
          <option value="Matoke"></option>
          <option value="Chapati"></option>
        </datalist>
      </div>

      <div class="form-group">
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="6" placeholder="Write your message (more than 20 characters)" required></textarea>
        <p id="message-error" class="error-message" role="alert"></p>
      </div>

      <button type="submit">Send Message</button>
    </form>

    <!-- Shown by JavaScript after a successful submit -->
    <div id="confirmation" class="confirmation hidden" role="status"></div>

  </main>

  <footer class="site-footer">
    <p>&copy; 2026 Tastes of Africa. Celebrating African food heritage.</p>

    <form class="newsletter" id="newsletter-form">
      <label for="newsletter-email">Join our newsletter</label>
      <input type="email" id="newsletter-email" name="email" placeholder="you@example.com" required>
      <button type="submit">Subscribe</button>
    </form>
  </footer>

  <script src="script.js"></script>
</body>
</html>
